server {
    listen 80;
    
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Dòng quan trọng nhất: Nếu không tìm thấy file, hãy trả về index.html
        try_files $uri $uri/ /index.html;
    }

    # Cấu hình thêm để tránh lỗi CORS nếu cần
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}