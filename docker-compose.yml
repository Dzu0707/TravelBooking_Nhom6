services:
  # 1. Cơ sở dữ liệu (SQL Server)
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: travel-tour-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrongPassword123!
    ports:
      - "1433:1433"
    volumes:
      # Dùng named volume để Docker tự quản lý data thô (bền vững và nhẹ Git)
      - sql_data_volume:/var/opt/mssql 
      # Gắn folder chứa script để máy kia có file init.sql (nếu cần)
      - ./sql_data:/usr/config 
    networks:
      - travel-network

  # 2. Backend (ASP.NET Core API)
  api:
    build: 
      context: ./backend  # Đã sửa theo tên folder mới của Leader
      dockerfile: Dockerfile
    container_name: backend-travel-tour
    depends_on:
      - db
    ports:
      - "5091:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=TravelTourDB;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True
    networks:
      - travel-network

  # 3. Frontend (React Vite)
  client:
    build: 
      context: ./frontend # Đã sửa theo tên folder mới của Leader
      dockerfile: Dockerfile
    container_name: frontend-travel-tour
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - travel-network

# Khai báo Volume để lưu trữ bền vững
volumes:
  sql_data_volume: # Tên volume khớp với phần khai báo ở dịch vụ db

networks:
  travel-network:
    driver: bridge