services:
  # Cơ sở dữ liệu
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: travel-tour-db
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrongPassword123!
    ports:
      - "1433:1433"
    volumes:
      - sql_data_volume:/var/opt/mssql
    networks:
      - travel-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrongPassword123!' -Q 'SELECT 1' -C"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  api:
    build: ./backend
    container_name: backend-travel-tour
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5091:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=TravelTourDB;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True
    networks:
      - travel-network

  # Frontend Client
  client:
    build: ./frontend
    container_name: frontend-travel-tour
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - travel-network

volumes:
  sql_data_volume:

networks:
  travel-network:
    driver: bridge